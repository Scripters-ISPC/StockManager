<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Stock Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body class="login-shell">

    <div class="login-wrapper">
        <div class="login-brand">
            <h1>Stock<span>Manager</span></h1>
            <p>Sistema de Gestión de Logística Interna</p>
        </div>

        <div class="login-card">
            <form>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="nombre@empresa.com" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-brand py-2">Iniciar Sesión</button>
                </div>
            </form>

            <div class="login-divider">ó ingresá directo (demo)</div>

            <div class="role-access-title">Acceso por rol</div>
            <div class="role-buttons">
                <a href="./index.html" class="btn-role">
                    <span>🔑</span>
                    <strong>Administrador</strong>
                    <small>Acceso total</small>
                </a>
                <a href="./index.html" class="btn-role">
                    <span>📦</span>
                    <strong>Operario</strong>
                    <small>Inventario y pedidos</small>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
