<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | StockManager</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="brand-logo">
            <h1>Stock<span>Manager</span></h1>
            <p>Sistema de Gestión de Logística Interna</p>
        </div>

        <div class="login-card">
            <form id="loginForm" onsubmit="event.preventDefault(); alert('Por favor, selecciona una de las opciones de acceso rápido abajo para ingresar de forma simulada.');">
                <div class="mb-4">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="nombre@empresa.com" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn-submit">Iniciar Sesión</button>
                </div>
            </form>

            <div class="divider">ó ingresa directo</div>

            <div class="role-access-title">Acceso por Roles</div>
            <div class="role-buttons">
                <a href="./index.html?role=admin" class="btn-role btn-role-admin">
                    <span>🔑</span>
                    <strong>Administrador</strong>
                    <small>Acceso total</small>
                </a>
                <a href="./index.html?role=almacen" class="btn-role btn-role-almacen">
                    <span>📦</span>
                    <strong>Personal de Almacén</strong>
                    <small>Inventario</small>
                </a>
                <a href="./index.html?role=logistica" class="btn-role btn-role-logistica">
                    <span>🚚</span>
                    <strong>Encargado de Logística</strong>
                    <small>Alertas y pedidos</small>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
