<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <button class="menu-btn" id="menuBtn">
        ☰
    </button>

    <div class="dashboard-container">

        <aside class="sidebar" id="sidebar">

            <h2 class="logo">
                <a href="./index.html">StockManager</a>
            </h2>

            <nav class="nav-links">
                <a href="./index.html">Inicio Panel</a>
                <a href="./inventario.html">Inventario</a>
                <a href="./alertas.html">Alertas</a>
                <a href="./pedidos-formulario.html">Nueva Solicitud</a>
                <a href="./pedidos.html" class="admin-only">Pedidos</a>
                <a href="./historial-pedidos.html" class="admin-only">Historial Pedidos</a>
                <hr style="border-color: rgba(255,255,255,0.15); margin: 0.5rem 0;">
                <a href="../index.html">Volver al Sitio</a>
            </nav>

        </aside>

        <main class="main-content">

            <h1>Dashboard</h1>

            <div class="metrics-container">

                <div class="metric-card">

                    <h3>Total de productos</h3>

                    <p class="metric-number">1,240</p>

                    <div class="progress-bar">
                        <div class="progress total-products"></div>
                    </div>

                </div>

                <div class="metric-card">

                    <h3>Productos bajo stock</h3>

                    <p class="metric-number">18</p>

                    <div class="progress-bar">
                        <div class="progress low-stock"></div>
                    </div>

                </div>

                <div class="metric-card">

                    <h3>Pedidos pendientes</h3>

                    <p class="metric-number">35</p>

                    <div class="progress-bar">
                        <div class="progress pending-orders"></div>
                    </div>

                </div>

            </div>

        </main>

    </div>

    <footer class="footer">
        <div class="container">
            © 2026 - Scripters
        </div>        
    </footer>

    <script src="./js/scripts.js"></script>

</body>

</html>
