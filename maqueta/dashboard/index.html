<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Stock Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>

    <div class="dashboard-shell">

        <aside class="sidebar">
            <div class="sidebar-brand">
                <a href="./index.html">Stock<span>Manager</span></a>
            </div>
            <nav class="sidebar-nav" aria-label="Navegación del panel">
                <a href="./index.html" class="nav-item active" aria-current="page">Inicio</a>
                <a href="./inventario.html" class="nav-item">Inventario</a>
                <a href="./alertas.html" class="nav-item">Alertas</a>
                <a href="./pedidos-formulario.html" class="nav-item">Nueva Solicitud</a>
                <a href="./pedidos.html" class="nav-item">Pedidos</a>
                <a href="./historial-pedidos.html" class="nav-item">Historial de Pedidos</a>
                <!-- visible solo para rol Administrador -->
                <a href="./usuarios.html" class="nav-item">Usuarios</a>
            </nav>
            <div class="sidebar-footer">
                <a href="./login.html" class="nav-item nav-item-exit">Cerrar sesión</a>
            </div>
        </aside>

        <main class="main-content">
            <h1>Dashboard</h1>
            <p class="page-lead">Resumen general del estado del inventario y la logística interna.</p>

            <div class="row g-4">
                <div class="col-md-4">
                    <div class="metric-card">
                        <h3>Total de productos</h3>
                        <p class="metric-number">1.240</p>
                        <div class="progress" role="progressbar" aria-label="Total de productos" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100" style="height: 8px;">
                            <div class="progress-bar bg-brand" style="width: 85%;"></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="metric-card">
                        <h3>Productos bajo stock</h3>
                        <p class="metric-number">18</p>
                        <div class="progress" role="progressbar" aria-label="Productos bajo stock" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="height: 8px;">
                            <div class="progress-bar bg-danger" style="width: 25%;"></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="metric-card">
                        <h3>Pedidos pendientes</h3>
                        <p class="metric-number">35</p>
                        <div class="progress" role="progressbar" aria-label="Pedidos pendientes" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="height: 8px;">
                            <div class="progress-bar bg-warning" style="width: 60%;"></div>
                        </div>
                    </div>
                </div>
            </div>

        </main>

    </div>

</body>
</html>
