<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <button class="menu-btn" id="menuBtn">
        ☰
    </button>

    <div class="dashboard-container">

        <aside class="sidebar" id="sidebar">

            <h2 class="logo">
                <a href="./index.html">StockManager</a>
            </h2>

            <nav class="nav-links">
                <a href="./index.html" class="nav-item" data-roles="admin,almacen,logistica">Inicio Panel</a>
                <a href="./inventario.html" class="nav-item" data-roles="admin,almacen">Inventario</a>
                <a href="./alertas.html" class="nav-item" data-roles="admin,logistica">Alertas</a>
                <a href="./pedidos-formulario.html" class="nav-item" data-roles="admin,logistica">Nueva Solicitud</a>
                <div class="nav-group" id="pedidosGroup" data-roles="admin,logistica">
                    <button type="button" class="nav-group-toggle" id="pedidosToggle" aria-expanded="false">
                        <span>Pedidos</span>
                        <span class="nav-chevron">▾</span>
                    </button>
                    <div class="nav-submenu" id="pedidosSubmenu">
                        <a href="./historial-pedidos.html" class="nav-subitem">Historial de Pedidos</a>
                    </div>
                </div>
            </nav>

        </aside>

        <main class="main-content">

            <h1>Dashboard</h1>

            <div class="metrics-container">

                <div class="metric-card">

                    <h3>Total de productos</h3>

                    <p class="metric-number">1,240</p>

                    <div class="progress-bar">
                        <div class="progress total-products"></div>
                    </div>

                </div>

                <div class="metric-card">

                    <h3>Productos bajo stock</h3>

                    <p class="metric-number">18</p>

                    <div class="progress-bar">
                        <div class="progress low-stock"></div>
                    </div>

                </div>

                <div class="metric-card">

                    <h3>Pedidos pendientes</h3>

                    <p class="metric-number">35</p>

                    <div class="progress-bar">
                        <div class="progress pending-orders"></div>
                    </div>

                </div>

            </div>

        </main>

    </div>

    <footer class="footer">
        <div class="container">
            © 2026 - Scripters
        </div>        
    </footer>

    <script src="./js/scripts.js"></script>

</body>

</html>
