<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | StockManager</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #404f66;
            --primary-dark: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: #1e293b;
            overflow-x: hidden;
        }

        .login-wrapper {
            width: 100%;
            max-width: 480px;
            z-index: 10;
        }

        .brand-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-logo h1 {
            color: #ffffff;
            font-weight: 700;
            font-size: 2.25rem;
            letter-spacing: -0.05rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .brand-logo h1 span {
            color: var(--accent-color);
        }

        .brand-logo p {
            color: #94a3b8;
            font-size: 1rem;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 1.25rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
        }

        .form-label {
            font-weight: 500;
            color: #334155;
            margin-bottom: 0.5rem;
        }

        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 2px solid #cbd5e1;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            outline: none;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 0.8rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(64, 79, 102, 0.25);
        }

        .btn-submit:hover {
            background-color: var(--primary-dark);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(30, 41, 59, 0.35);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 2rem 0;
            color: #64748b;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #cbd5e1;
        }

        .divider:not(:empty)::before {
            margin-right: .75em;
        }

        .divider:not(:empty)::after {
            margin-left: .75em;
        }

        .role-access-title {
            text-align: center;
            font-size: 0.875rem;
            color: #475569;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .role-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        @media (max-width: 640px) {
            .role-buttons {
                grid-template-columns: 1fr;
            }
        }

        .btn-role {
            padding: 0.75rem 0.5rem;
            border-radius: 0.75rem;
            font-weight: 500;
            font-size: 0.875rem;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            border: 2px dashed #94a3b8;
            background-color: #f8fafc;
            color: #334155;
        }

        .btn-role-admin {
            border-color: rgba(59, 130, 246, 0.4);
            color: #1e3a8a;
        }

        .btn-role-admin:hover {
            background-color: #eff6ff;
            border-color: var(--accent-color);
            border-style: solid;
            transform: translateY(-2px);
        }

        .btn-role-almacen {
            border-color: rgba(16, 185, 129, 0.4);
            color: #064e3b;
        }

        .btn-role-almacen:hover {
            background-color: #ecfdf5;
            border-color: #10b981;
            border-style: solid;
            transform: translateY(-2px);
        }

        .btn-role-logistica {
            border-color: rgba(245, 158, 11, 0.4);
            color: #78350f;
        }

        .btn-role-logistica:hover {
            background-color: #fffbeb;
            border-color: #f59e0b;
            border-style: solid;
            transform: translateY(-2px);
        }

        .btn-role span {
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
        }

        .btn-role small {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 0.1rem;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #64748b;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .back-link a:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="brand-logo">
            <h1>Stock<span>Manager</span></h1>
            <p>Sistema de Gestión de Logística Interna</p>
        </div>

        <div class="login-card">
            <form id="loginForm" onsubmit="event.preventDefault(); alert('Por favor, selecciona una de las opciones de acceso rápido abajo para ingresar de forma simulada.');">
                <div class="mb-4">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="nombre@empresa.com" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn-submit">Iniciar Sesión</button>
                </div>
            </form>

            <div class="divider">ó ingresa directo</div>

            <div class="role-access-title">Acceso por Roles</div>
            <div class="role-buttons">
                <a href="./dashboard/index.html?role=admin" class="btn-role btn-role-admin">
                    <span>🔑</span>
                    <strong>Administrador</strong>
                    <small>Acceso total</small>
                </a>
                <a href="./dashboard/index.html?role=almacen" class="btn-role btn-role-almacen">
                    <span>📦</span>
                    <strong>Personal de Almacén</strong>
                    <small>Inventario</small>
                </a>
                <a href="./dashboard/index.html?role=logistica" class="btn-role btn-role-logistica">
                    <span>🚚</span>
                    <strong>Encargado de Logística</strong>
                    <small>Alertas y pedidos</small>
                </a>
            </div>
        </div>

        <div class="back-link">
            <a href="./index.html">← Volver a Inicio Público</a>
        </div>
    </div>

</body>
</html>
