<div class="mb-3">
    <a routerLink="/dashboard/inventario" class="btn btn-outline-secondary btn-sm">← Volver al Inventario</a>
</div>
<h1>🧾 Agregar / Editar Material</h1>
<p class="page-lead">Esta vista permite dar de alta insumos y definir los umbrales de stock crítico.</p>
<div class="card shadow-sm border-0" style="max-width: 640px;">
    <div class="card-body p-4">
        <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
                <label for="nombre-material" class="form-label">Nombre del Material <span class="text-danger">*</span></label>
                <input type="text" id="nombre-material" name="nombre" [(ngModel)]="nombre" class="form-control" placeholder="Ej: Resma Papel A4" required>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-sm-6">
                    <label for="categoria" class="form-label">Categoría <span class="text-danger">*</span></label>
                    <select id="categoria" name="categoria" [(ngModel)]="categoria" class="form-select" required>
                        <option value="">Seleccione categoría...</option>
                        <option value="libreria">Librería</option>
                        <option value="insumos">Insumos</option>
                        <option value="bazar-oficina">Bazar y Oficina</option>
                        <option value="marketing">Marketing</option>
                    </select>
                </div>
                <div class="col-sm-6">
                    <label for="ubicacion" class="form-label">Ubicación Física</label>
                    <input type="text" id="ubicacion" name="ubicacion" [(ngModel)]="ubicacion" class="form-control" placeholder="Ej: Pasillo 2 - Estante B">
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-sm-6">
                    <label for="cantidad-actual" class="form-label">Cantidad Actual <span class="text-danger">*</span></label>
                    <input type="number" id="cantidad-actual" name="cantidadActual" [(ngModel)]="cantidadActual" class="form-control" min="0" required>
                </div>
                <div class="col-sm-6">
                    <label for="stock-minimo" class="form-label">Stock Mínimo <span class="text-danger">*</span></label>
                    <input type="number" id="stock-minimo" name="stockMinimo" [(ngModel)]="stockMinimo" class="form-control" min="0" required>
                    <div class="form-text">Debajo de este valor, el material aparece en Alertas.</div>
                </div>
            </div>
            <div class="mb-4">
                <label for="proveedor-sugerido" class="form-label">Proveedor Sugerido</label>
                <input type="text" id="proveedor-sugerido" name="proveedor" [(ngModel)]="proveedor" class="form-control" placeholder="Ej: Librería Central S.A.">
            </div>
            <button type="submit" class="btn btn-brand w-100 py-2">Guardar Material</button>
        </form>
    </div>
</div>
